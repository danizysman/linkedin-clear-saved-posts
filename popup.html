<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Saved Posts Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Saved Posts Manager</h1>
      <span id="statusBadge" class="badge badge-idle">Idle</span>
    </header>

    <nav class="tabs" role="tablist" aria-label="Mode">
      <button id="tabExportBtn" class="tab-btn active" type="button" role="tab" aria-selected="true">Export</button>
      <button id="tabUnsaveBtn" class="tab-btn" type="button" role="tab" aria-selected="false">Unsave</button>
    </nav>

    <section id="exportPanel" class="card" role="tabpanel">
      <div class="export-hero">
        <span class="hero-count" id="exportedCount">0</span>
        <span class="hero-label">posts collected</span>
      </div>

      <div class="row-2">
        <button id="exportBtn" class="btn btn-primary" type="button">Scrape Saved Posts</button>
        <button id="exportStopBtn" class="btn btn-danger" type="button" disabled>Stop</button>
      </div>

      <div class="row-2">
        <button id="downloadJsonBtn" class="btn btn-secondary" type="button" disabled>Download JSON</button>
        <button id="useExportedBtn" class="btn btn-secondary" type="button" disabled>Send to Unsave</button>
      </div>
    </section>

    <section id="unsavePanel" class="card" role="tabpanel" hidden>
      <div class="file-row">
        <label for="jsonFiles" class="btn btn-secondary file-btn">
          + Load JSON
          <input type="file" id="jsonFiles" accept=".json" multiple hidden>
        </label>
        <span class="inline-summary">
          <strong id="remainingCount">0</strong> left ·
          <strong id="historyCount">0</strong> done ·
          <strong id="targetCount">0</strong> total
        </span>
      </div>

      <div class="settings-row">
        <label class="inline-field" for="maxPosts">
          <span>Max</span>
          <input type="number" id="maxPosts" min="1" max="5000" value="25">
        </label>
        <div class="inline-field">
          <span>Delay</span>
          <input type="number" id="minDelay" min="0.2" max="60" step="0.1" value="0.8" aria-label="Minimum delay in seconds">
          <span>–</span>
          <input type="number" id="maxDelay" min="0.2" max="60" step="0.1" value="1.5" aria-label="Maximum delay in seconds">
          <span>s</span>
        </div>
      </div>

      <label class="checkbox-row" for="dryRun">
        <input type="checkbox" id="dryRun">
        <span>Dry Run (highlight matches only)</span>
      </label>

      <div class="actions">
        <button id="startBtn" class="btn btn-primary" type="button">Start Unsaving</button>
        <button id="stopBtn" class="btn btn-danger" type="button" disabled>Stop</button>
        <button id="clearHistoryBtn" class="btn btn-secondary" type="button">Clear</button>
      </div>

      <div id="clearWarning" class="warning-banner" hidden>
        <p>Clear all exported JSON posts, target URNs, and unsaved history?</p>
        <div class="warning-actions">
          <button id="confirmClearBtn" class="btn btn-danger" type="button">Yes, Clear All</button>
          <button id="cancelClearBtn" class="btn btn-secondary" type="button">Cancel</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="progress-line">
        <span>Scanned <strong id="scannedCount">0</strong></span>
        <span>·</span>
        <span>Matched <strong id="matchedCount">0</strong></span>
        <span>·</span>
        <span>Unsaved <strong id="unsavedCount">0</strong></span>
        <span>·</span>
        <span>Skip <strong id="skippedCount">0</strong></span>
      </div>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite">Ready. Open LinkedIn Saved Posts.</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
