<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Unsave Automator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-group">
        <h1>Saved Posts Unsave</h1>
        <p class="subtitle">LinkedIn Saved Post Hero</p>
      </div>
      <span id="statusBadge" class="badge badge-idle">Idle</span>
    </header>

    <section class="card">
      <label for="jsonFiles" class="file-label">
        <span class="file-label-title">Load JSON Export(s)</span>
        <span class="file-label-hint">Select one or more .json files</span>
        <input type="file" id="jsonFiles" accept=".json" multiple>
      </label>

      <div class="stats-grid stats-grid-3">
        <div class="stat-box">
          <span class="stat-value" id="targetCount">0</span>
          <span class="stat-label">Target URNs</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="historyCount">0</span>
          <span class="stat-label">Already Unsaved</span>
        </div>
        <div class="stat-box stat-box-accent">
          <span class="stat-value" id="remainingCount">0</span>
          <span class="stat-label">Remaining</span>
        </div>
      </div>
    </section>

    <section class="card controls">
      <div class="control-row">
        <label for="maxPosts">Max posts per run</label>
        <input type="number" id="maxPosts" min="1" max="5000" value="25">
      </div>

      <div class="control-row">
        <label for="minDelay">Delay range (sec)</label>
        <div class="delay-inputs">
          <input type="number" id="minDelay" min="0.5" max="60" step="0.1" value="2.5" aria-label="Minimum delay in seconds">
          <span class="delay-sep">to</span>
          <input type="number" id="maxDelay" min="0.5" max="60" step="0.1" value="4.5" aria-label="Maximum delay in seconds">
        </div>
      </div>

      <label class="checkbox-row" for="dryRun">
        <input type="checkbox" id="dryRun">
        <span>Dry Run (highlight matches only)</span>
      </label>
    </section>

    <section class="actions">
      <button id="startBtn" class="btn btn-primary" type="button">Start Unsaving</button>
      <button id="stopBtn" class="btn btn-danger" type="button" disabled>Stop</button>
      <button id="clearHistoryBtn" class="btn btn-secondary" type="button">Clear History</button>
    </section>

    <section class="card">
      <div class="section-header">Live Progress</div>
      <div class="stats-grid stats-grid-4">
        <div class="stat-box">
          <span class="stat-value" id="scannedCount">0</span>
          <span class="stat-label">Scanned</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="matchedCount">0</span>
          <span class="stat-label">Matched</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="unsavedCount">0</span>
          <span class="stat-label">Unsaved</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="skippedCount">0</span>
          <span class="stat-label">Skipped</span>
        </div>
      </div>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite">Ready. Open LinkedIn Saved Posts and load your JSON export.</p>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
